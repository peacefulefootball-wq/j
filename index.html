<body>
    <!-- Main Calculator -->
    <div class="calculator" role="main" aria-label="World's best scientific calculator by Mahedi Hassan Anik">
        <!-- Display Section -->
        <div class="display-container">
            <div class="history-expression" id="historyExpr" aria-label="Calculation history"></div>
            <input type="text" class="current-input" id="currentInput" readonly value="0" aria-label="Calculator output" aria-live="polite">
            <div class="digit-counter" id="digitCounter" aria-label="Digit count">📊 0/12</div>
        </div>

        <!-- Mode Indicator -->
        <div class="mode-indicator" id="modeIndicator" aria-label="Current angle mode">DEG</div>

        <!-- Button Grid -->
        <div class="button-grid" id="calcButtons" aria-label="Calculator keypad">
            <!-- Row 1: Mode & Hyperbolic -->
            <button class="calc-btn mode-btn" data-value="DEG/RAD" aria-label="Toggle degree radian mode">DEG/RAD</button>
            <button class="calc-btn fn-btn" data-value="sinh" aria-label="Hyperbolic sine">sinh</button>
            <button class="calc-btn fn-btn" data-value="cosh" aria-label="Hyperbolic cosine">cosh</button>
            <button class="calc-btn fn-btn" data-value="tanh" aria-label="Hyperbolic tangent">tanh</button>
            <button class="calc-btn fn-btn" data-value="rand" aria-label="Random number">rand</button>
            
            <!-- Row 2: Trig Functions -->
            <button class="calc-btn fn-btn" data-value="sin" aria-label="Sine">sin</button>
            <button class="calc-btn fn-btn" data-value="cos" aria-label="Cosine">cos</button>
            <button class="calc-btn fn-btn" data-value="tan" aria-label="Tangent">tan</button>
            <button class="calc-btn fn-btn" data-value="csc" aria-label="Cosecant">csc</button>
            <button class="calc-btn fn-btn" data-value="sec" aria-label="Secant">sec</button>
            
            <!-- Row 3: More Trig & Log -->
            <button class="calc-btn fn-btn" data-value="cot" aria-label="Cotangent">cot</button>
            <button class="calc-btn fn-btn" data-value="log" aria-label="Logarithm base 10">log</button>
            <button class="calc-btn fn-btn" data-value="ln" aria-label="Natural logarithm">ln</button>
            <button class="calc-btn fn-btn" data-value="√" aria-label="Square root">√</button>
            <button class="calc-btn fn-btn" data-value="∛" aria-label="Cube root">∛</button>
            
            <!-- Row 4: Powers & Exponentials -->
            <button class="calc-btn fn-btn" data-value="x^2" aria-label="Square">x²</button>
            <button class="calc-btn fn-btn" data-value="x^3" aria-label="Cube">x³</button>
            <button class="calc-btn fn-btn" data-value="^" aria-label="Power">x^y</button>
            <button class="calc-btn fn-btn" data-value="10^x" aria-label="10 to the power x">10^x</button>
            <button class="calc-btn fn-btn" data-value="e^x" aria-label="E to the power x">e^x</button>
            
            <!-- Row 5: Constants & More Functions -->
            <button class="calc-btn fn-btn" data-value="π" aria-label="Pi constant">π</button>
            <button class="calc-btn fn-btn" data-value="e" aria-label="Euler's number">e</button>
            <button class="calc-btn fn-btn" data-value="!" aria-label="Factorial">n!</button>
            <button class="calc-btn fn-btn" data-value="1/x" aria-label="Reciprocal">1/x</button>
            <button class="calc-btn fn-btn" data-value="abs" aria-label="Absolute value">|x|</button>
            
            <!-- Row 6: Rounding & Misc -->
            <button class="calc-btn fn-btn" data-value="round" aria-label="Round to nearest integer">round</button>
            <button class="calc-btn fn-btn" data-value="floor" aria-label="Floor function">floor</button>
            <button class="calc-btn fn-btn" data-value="ceil" aria-label="Ceiling function">ceil</button>
            <button class="calc-btn fn-btn" data-value="mod" aria-label="Modulus">mod</button>
            <button class="calc-btn clear-btn" data-value="C" aria-label="Clear all">C</button>
            
            <!-- Row 7: Parentheses, Backspace and Division/Multiplication -->
            <button class="calc-btn fn-btn" data-value="(" aria-label="Open parenthesis">(</button>
            <button class="calc-btn fn-btn" data-value=")" aria-label="Close parenthesis">)</button>
            <button class="calc-btn backspace-btn" data-value="backspace" aria-label="Backspace">⌫</button>
            <button class="calc-btn operator-btn" data-value="/" aria-label="Divide">÷</button>
            <button class="calc-btn operator-btn" data-value="*" aria-label="Multiply">×</button>
            
            <!-- Row 8: Numbers 7-9, Minus and Percentage -->
            <button class="calc-btn" data-value="7" aria-label="Seven">7</button>
            <button class="calc-btn" data-value="8" aria-label="Eight">8</button>
            <button class="calc-btn" data-value="9" aria-label="Nine">9</button>
            <button class="calc-btn operator-btn" data-value="-" aria-label="Subtract">−</button>
            <button class="calc-btn fn-btn" data-value="%" aria-label="Percentage">%</button>
            
            <!-- Row 9: Numbers 4-6, Plus and Equals -->
            <button class="calc-btn" data-value="4" aria-label="Four">4</button>
            <button class="calc-btn" data-value="5" aria-label="Five">5</button>
            <button class="calc-btn" data-value="6" aria-label="Six">6</button>
            <button class="calc-btn operator-btn" data-value="+" aria-label="Add">+</button>
            <button class="calc-btn equal-btn" data-value="=" aria-label="Equals">=</button>
            
            <!-- Row 10: Numbers 1-3, Zero and Ans -->
            <button class="calc-btn" data-value="1" aria-label="One">1</button>
            <button class="calc-btn" data-value="2" aria-label="Two">2</button>
            <button class="calc-btn" data-value="3" aria-label="Three">3</button>
            <button class="calc-btn" data-value="0" aria-label="Zero">0</button>
            <button class="calc-btn fn-btn" data-value="ans" aria-label="Last answer">Ans</button>
            
            <!-- Row 11: Extra buttons with HELP button -->
            <button class="calc-btn" data-value="00" aria-label="Double zero">00</button>
            <button class="calc-btn" data-value="." aria-label="Decimal point">.</button>
            <button class="calc-btn fn-btn" data-value="±" aria-label="Toggle sign">±</button>
            <button class="calc-btn fn-btn" data-value="RND" aria-label="Random number">RND</button>
            <button class="calc-btn help-btn" data-value="help" id="helpBtn" aria-label="Help and instructions">HELP</button>
        </div>

        <!-- Footer -->
        <div class="footer">
